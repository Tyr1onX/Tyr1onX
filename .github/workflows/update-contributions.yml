name: Update profile data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-contributions.yml"

permissions:
  contents: write

concurrency:
  group: update-profile-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Clone profile repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo

      - name: Refresh profile data
        working-directory: repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: Tyr1onX
          CONTRIBUTION_LIMIT: "5"
        run: |
          set -euo pipefail
          python3 <<'PY'
          import datetime as dt
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          login = os.environ["PROFILE_LOGIN"]
          limit = int(os.environ["CONTRIBUTION_LIMIT"])
          token = os.environ["GH_TOKEN"]

          common_headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "profile-data-updater",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request_json(url, *, payload=None, headers=None):
              merged_headers = dict(common_headers)
              if headers:
                  merged_headers.update(headers)

              body = None
              if payload is not None:
                  body = json.dumps(payload).encode("utf-8")
                  merged_headers["Content-Type"] = "application/json"

              for attempt in range(3):
                  request = urllib.request.Request(
                      url,
                      data=body,
                      headers=merged_headers,
                      method="POST" if payload is not None else "GET",
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as error:
                      details = error.read().decode("utf-8", errors="replace")
                      if attempt == 2 or error.code not in {403, 429, 502, 503}:
                          raise RuntimeError(
                              f"GitHub request failed ({error.code}) for {url}: {details}"
                          ) from error
                      time.sleep(2 ** attempt)

              raise RuntimeError(f"GitHub request returned no data for {url}")

          # Keep the existing list of recently merged external pull requests.
          params = urllib.parse.urlencode({
              "q": f"author:{login} is:pr is:merged -user:{login}",
              "sort": "updated",
              "order": "desc",
              "per_page": "100",
          })
          search_data = request_json(f"https://api.github.com/search/issues?{params}")

          pull_requests = []
          for item in search_data.get("items", []):
              pull_request = item.get("pull_request") or {}
              merged_at = pull_request.get("merged_at") or item.get("closed_at")
              repository_url = item.get("repository_url", "")
              if not merged_at or "/repos/" not in repository_url:
                  continue

              repository = repository_url.split("/repos/", 1)[1]
              repository_owner = repository.split("/", 1)[0]
              if repository_owner.casefold() == login.casefold():
                  continue

              title = " ".join(item.get("title", "").split())
              title = (
                  title.replace("\\", "\\\\")
                  .replace("[", "\\[")
                  .replace("]", "\\]")
                  .replace("<", "&lt;")
                  .replace(">", "&gt;")
              )
              pull_requests.append({
                  "merged_at": merged_at,
                  "repository": repository,
                  "number": item["number"],
                  "url": item["html_url"],
                  "title": title,
              })

          pull_requests.sort(key=lambda item: item["merged_at"], reverse=True)
          pull_requests = pull_requests[:limit]

          lines = [
              f"- [{item['repository']} #{item['number']}]({item['url']}) — {item['title']}"
              for item in pull_requests
          ] or ["_暂无已合并 Pull Request。_"]

          start = "<!-- OPEN_SOURCE_CONTRIBUTIONS:START -->"
          end = "<!-- OPEN_SOURCE_CONTRIBUTIONS:END -->"
          block = f"{start}\n" + "\n".join(lines) + f"\n{end}"

          readme_path = "README.md"
          with open(readme_path, "r", encoding="utf-8") as file:
              readme = file.read()

          pattern = re.compile(
              rf"{re.escape(start)}.*?{re.escape(end)}",
              flags=re.DOTALL,
          )
          if not pattern.search(readme):
              raise RuntimeError("Contribution markers were not found in README.md")

          updated_readme = pattern.sub(block, readme)
          if updated_readme != readme:
              with open(readme_path, "w", encoding="utf-8", newline="\n") as file:
                  file.write(updated_readme)

          # Fetch the profile metrics used by the repository-owned SVG card.
          now = dt.datetime.now(dt.timezone.utc)
          year_start = dt.datetime(now.year, 1, 1, tzinfo=dt.timezone.utc)
          from_value = year_start.strftime("%Y-%m-%dT%H:%M:%SZ")
          to_value = now.strftime("%Y-%m-%dT%H:%M:%SZ")

          profile_query = """
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              contributionsCollection(from: $from, to: $to) {
                contributionCalendar { totalContributions }
                totalCommitContributions
                totalIssueContributions
                totalPullRequestContributions
              }
              repositories(
                ownerAffiliations: OWNER
                privacy: PUBLIC
                first: 100
                orderBy: {field: UPDATED_AT, direction: DESC}
              ) {
                totalCount
                nodes { stargazerCount }
                pageInfo { hasNextPage endCursor }
              }
            }
          }
          """

          graph = request_json(
              "https://api.github.com/graphql",
              payload={
                  "query": profile_query,
                  "variables": {
                      "login": login,
                      "from": from_value,
                      "to": to_value,
                  },
              },
          )
          if graph.get("errors"):
              raise RuntimeError(f"GitHub GraphQL failed: {graph['errors']}")

          user = (graph.get("data") or {}).get("user")
          if not user:
              raise RuntimeError(f"GitHub user {login!r} was not found")

          contributions = user["contributionsCollection"]
          repositories = user["repositories"]
          stars = sum(repo["stargazerCount"] for repo in repositories["nodes"])
          page_info = repositories["pageInfo"]

          repos_query = """
          query($login: String!, $after: String!) {
            user(login: $login) {
              repositories(
                ownerAffiliations: OWNER
                privacy: PUBLIC
                first: 100
                after: $after
                orderBy: {field: UPDATED_AT, direction: DESC}
              ) {
                nodes { stargazerCount }
                pageInfo { hasNextPage endCursor }
              }
            }
          }
          """

          while page_info["hasNextPage"]:
              next_page = request_json(
                  "https://api.github.com/graphql",
                  payload={
                      "query": repos_query,
                      "variables": {
                          "login": login,
                          "after": page_info["endCursor"],
                      },
                  },
              )
              if next_page.get("errors"):
                  raise RuntimeError(f"GitHub GraphQL pagination failed: {next_page['errors']}")
              repo_page = next_page["data"]["user"]["repositories"]
              stars += sum(repo["stargazerCount"] for repo in repo_page["nodes"])
              page_info = repo_page["pageInfo"]

          metrics = {
              "contributions": contributions["contributionCalendar"]["totalContributions"],
              "commits": contributions["totalCommitContributions"],
              "pull_requests": contributions["totalPullRequestContributions"],
              "issues": contributions["totalIssueContributions"],
              "repositories": repositories["totalCount"],
              "stars": stars,
          }

          def number(value):
              return f"{int(value):,}"

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="720" height="278" viewBox="0 0 720 278" role="img" aria-labelledby="title desc">
            <title id="title">GitHub 活动</title>
            <desc id="desc">{login} 在 {now.year} 年的 GitHub 公开活动数据。</desc>
            <style>
              .bg {{ fill: #ffffff; stroke: #d0d7de; }}
              .rule {{ stroke: #d8dee4; }}
              .mark {{ fill: #24292f; }}
              .title {{ fill: #1f2328; font: 600 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }}
              .year {{ fill: #656d76; font: 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }}
              .eyebrow {{ fill: #656d76; font: 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing: .4px; }}
              .hero {{ fill: #1f2328; font: 600 48px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-variant-numeric: tabular-nums; }}
              .caption {{ fill: #8c959f; font: 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }}
              .metric-label {{ fill: #656d76; font: 13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }}
              .metric-value {{ fill: #1f2328; font: 600 15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-variant-numeric: tabular-nums; }}
              .foot {{ fill: #8c959f; font: 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }}
              .activity {{ fill: #1f883d; }}
              @media (prefers-color-scheme: dark) {{
                .bg {{ fill: #0d1117; stroke: #30363d; }}
                .rule {{ stroke: #30363d; }}
                .mark {{ fill: #f0f6fc; }}
                .title, .hero, .metric-value {{ fill: #e6edf3; }}
                .year, .eyebrow, .metric-label {{ fill: #8b949e; }}
                .caption, .foot {{ fill: #6e7681; }}
                .activity {{ fill: #3fb950; }}
              }}
            </style>

            <rect class="bg" x="0.5" y="0.5" width="719" height="277" rx="6" />

            <g class="mark" transform="translate(24 18) scale(.82)">
              <path d="M12 2.7a9.5 9.5 0 0 0-3 18.52c.48.1.65-.2.65-.46v-1.83c-2.65.58-3.2-1.12-3.2-1.12-.43-1.1-1.06-1.4-1.06-1.4-.87-.6.07-.59.07-.59.96.07 1.46.99 1.46.99.85 1.46 2.24 1.04 2.79.8.08-.62.33-1.04.6-1.28-2.12-.24-4.35-1.06-4.35-4.7 0-1.04.37-1.89.98-2.56-.1-.24-.43-1.21.09-2.52 0 0 .8-.26 2.61.98A9.1 9.1 0 0 1 12 7.22a9 9 0 0 1 2.38.32c1.81-1.23 2.61-.98 2.61-.98.52 1.31.19 2.28.09 2.52.61.67.98 1.52.98 2.56 0 3.65-2.24 4.46-4.37 4.7.34.3.65.88.65 1.78v2.64c0 .26.17.57.66.46A9.5 9.5 0 0 0 12 2.7Z" />
            </g>
            <text class="title" x="51" y="35">GitHub 活动</text>
            <text class="year" x="696" y="34" text-anchor="end">@{login} · {now.year}</text>
            <line class="rule" x1="24" y1="58.5" x2="696" y2="58.5" />

            <text class="eyebrow" x="26" y="91">今年贡献</text>
            <text class="hero" x="24" y="145">{number(metrics['contributions'])}</text>
            <rect class="activity" x="26" y="161" width="46" height="3" rx="1.5" />
            <text class="caption" x="26" y="184">{now.year} 年公开活动</text>

            <line class="rule" x1="310.5" y1="79" x2="310.5" y2="224" />

            <text class="metric-label" x="340" y="94">代码提交</text>
            <text class="metric-value" x="680" y="94" text-anchor="end">{number(metrics['commits'])}</text>
            <line class="rule" x1="340" y1="106.5" x2="680" y2="106.5" />

            <text class="metric-label" x="340" y="124">Pull requests</text>
            <text class="metric-value" x="680" y="124" text-anchor="end">{number(metrics['pull_requests'])}</text>
            <line class="rule" x1="340" y1="136.5" x2="680" y2="136.5" />

            <text class="metric-label" x="340" y="154">Issues</text>
            <text class="metric-value" x="680" y="154" text-anchor="end">{number(metrics['issues'])}</text>
            <line class="rule" x1="340" y1="166.5" x2="680" y2="166.5" />

            <text class="metric-label" x="340" y="184">公开仓库</text>
            <text class="metric-value" x="680" y="184" text-anchor="end">{number(metrics['repositories'])}</text>
            <line class="rule" x1="340" y1="196.5" x2="680" y2="196.5" />

            <text class="metric-label" x="340" y="214">获得 Stars</text>
            <text class="metric-value" x="680" y="214" text-anchor="end">{number(metrics['stars'])}</text>

            <line class="rule" x1="24" y1="236.5" x2="696" y2="236.5" />
            <text class="foot" x="24" y="260">Public GitHub activity</text>
            <text class="foot" x="696" y="260" text-anchor="end">更新于 {now.strftime('%Y-%m-%d %H:%M')} UTC</text>
          </svg>
          '''

          stats_path = ".github/github-stats.svg"
          with open(stats_path, "w", encoding="utf-8", newline="\n") as file:
              file.write(svg)
          PY

      - name: Commit changes
        working-directory: repo
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md .github/github-stats.svg; then
            echo "Profile data is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/github-stats.svg
          git commit -m "chore: refresh profile data"
          git push
